[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aero-kbd"
version = "0.1.0b1"
description = "Linux RGB keyboard control for GIGABYTE Aero laptops"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "kulunkilabs" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/kulunkilabs/aero-kbd"
Issues = "https://github.com/kulunkilabs/aero-kbd/issues"

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
aero-kbd = "aero_keyboard.cli:main"

[project.gui-scripts]
aero-kbd-gui = "aero_keyboard.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aero_keyboard"]

[tool.hatch.build.targets.wheel.force-include]
"packaging/icon/io.github.aero_keyboard_control.svg" = "aero_keyboard/gui/app-icon.svg"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: tests that communicate with a real keyboard"]
